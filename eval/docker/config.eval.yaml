# vigilo-eval config -- minimal slice per plan.md Q4 (webhook only, no
# suppression tuning, no Slack/Telegram/email). Immediate-tier signals only:
# analyst tier (Claude-dependent) is out of scope this pass, blocked on the
# same Anthropic billing issue as memkit-eval's resolver work.

watch_paths:
  - /app/keystore
  - /app/.env

exclude_paths:
  - /tmp
  - /root/.cache

# Network chain is poll-based -- this value is reported alongside every
# network-chain latency number (Step 0.5 H2), never blended into file-chain
# (fsnotify, event-driven) numbers as if it applied to those too.
poll_interval: 1s

buffer_retention_hours: 24

# HTTP transport so harness/mcp_client.py can reach it over the eval network,
# not stdio (which would require a subprocess pipe, not a fit for a
# container the harness doesn't own the process tree of).
# Disposable eval container on an internal docker network, so it opts out of the
# MCP token rather than carrying a secret. A real deployment must set mcp_token;
# the daemon refuses to start on http without one.
mcp_allow_unauthenticated: true
mcp_transport: http
mcp_addr: ":7070"

# CORRECTED (live verification, two real findings, both fixed upstream):
# vigilo's own 1h default (blindly copied from config.example.yaml)
# suppresses repeat alerts on the SAME resource for an hour regardless of
# content -- a noise-reduction feature for production, actively hostile to
# a controlled N-repeat latency measurement. A first attempt at 0s here hit
# a SECOND, deeper bug in internal/alerter/alerter.go's New(), which treated
# cfg.Cooldown == 0 as "unset" and silently forced 15 minutes regardless of
# what the config said. Fixed upstream (commit 335e4a7, negative-Duration
# sentinel instead of zero) -- 0s now means what it says.
signal_cooldown: 0s

alerter:
  # min_severity=high: matches Step 0.5 M-condition, only immediate-tier
  # signals we actually trigger (keystore/env read/write, suspicious
  # outbound) are severity=high or critical per the README's own table.
  min_severity: high
  webhooks:
    - name: eval-listener
      url: http://webhook-listener:8090/alert
      # no auth header -- eval-network-only traffic, never exposed to the
      # real internet (Step 0.5 C1/BLOCKER isolation)

# Deliberately empty -- Step 0 Q4 decided against suppression-rule tuning.
# Raw untuned false-positive rate is the honest out-of-box signal; tuning
# would flatter the number relative to what a first-time deployer sees.
suppress_rules: []
