version: 2

project_name: vigilo

before:
  hooks:
    - go mod tidy

builds:
  - id: vigilo
    main: ./cmd/vigilo
    binary: vigilo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - config.example.yaml
      - README.md
      - SECURITY.md
      - CHANGELOG.md
      - deploy/vigilo.service
      - deploy/install.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: agent-rails
    name: vigilo
  # The release workflow publishes only after the archive installation smoke test.
  draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## Vigilo {{ .Version }}

    OS-level observation and alerting for crypto infrastructure: filesystem
    create/write events, sampled process and network activity, and optional
    supply-chain checks. See CHANGELOG.md for v0.2.0 changes and upgrade notes.

    ### Quick start

    ```bash
    tar xzf vigilo_{{ .Version }}_linux_amd64.tar.gz
    sudo bash deploy/install.sh
    ```

    Choose the archive matching your operating system and CPU. The installer
    is for Linux with systemd; macOS users run the bundled binary directly.
    Existing config is preserved. Configure watch paths and alert delivery
    before starting the service. HTTP MCP now requires a bearer token by default.

    See [README](https://github.com/agent-rails/vigilo#readme) and
    [SECURITY.md](https://github.com/agent-rails/vigilo/blob/main/SECURITY.md)
    for full setup instructions.
